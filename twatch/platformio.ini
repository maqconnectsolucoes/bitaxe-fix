; Projeto T-Watch — painel Bitaxe
;
; Alvo: TTGO T-Watch 2020 V1 (ESP32-D0WDQ6-V3, 16MB flash, MAC b0:b2:1c:4e:33:3c).
; Modelo confirmado por análise do firmware anterior: PMU AXP202 (o V3 usa AXP2101).
;
; O ponto deste arquivo é travar o ambiente. O firmware anterior deste relógio foi
; compilado no Arduino IDE com core esp32 2.0.17 e o fonte se perdeu junto com a
; instalação. Aqui, core, libs e partições ficam versionados.

[env:t-watch-2020-v1]
platform  = espressif32@6.9.0   ; entrega o Arduino core esp32 2.0.17
board     = ttgo-t-watch
framework = arduino

; Parâmetros de flash lidos do próprio aparelho (log do bootloader ROM:
; "mode:DIO, clock div:1" = 80MHz) e do esptool ("Detected flash size: 16MB").
board_build.partitions   = partitions.csv
board_build.flash_mode   = dio
board_build.f_flash      = 80000000L
board_upload.flash_size  = 16MB

build_flags =
    -DLILYGO_WATCH_2020_V1=1
    -DBOARD_HAS_PSRAM
    ; O chip é rev v3.0, então o workaround de cache da PSRAM não é necessário.
    ; Em silício anterior a v3 seria obrigatório acrescentar:
    ;   -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=3

lib_deps =
    https://github.com/Xinyuan-LilyGO/TTGO_TWatch_Library.git
    bblanchon/ArduinoJson@^7.0.4

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder
upload_speed    = 921600

test_framework = unity
test_port  = COM5
test_speed = 115200
